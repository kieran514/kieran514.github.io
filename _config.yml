# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Kieran Saunders | Computer Vision Researcher
email: 190229315@aston.ac.uk
description: >- # this means to ignore newlines until "baseurl:"
  PhD candidate at Aston University specializing in self-supervised monocular depth estimation,
  robustness in computer vision, and 3D reconstruction.
baseurl: "" # the subpath of your site, e.g. /blog. Leave empty for username.github.io
url: "https://kieran514.github.io/" # the base hostname & protocol for your site
github_username: kieran514

# Minimal Mistakes Theme Settings
minimal_mistakes_skin: "default" # Start with default, we'll override colors via CSS

# Author Settings (Appears in sidebar)
author:
  name: "Kieran Saunders"
  avatar: "/assets/images/kieran_avatar.jpg" # Put your photo here
  bio: "PhD Candidate Aston University | Computer Vision"
  location: "Birmingham, UK"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:190229315@aston.ac.uk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kieran514"
    - label: "LinkedIn" # Optional - remove if no profile
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/kieran-saunders-6a5a801a3/"
    - label: "Google Scholar" # Optional - remove if no profile
      icon: "fas fa-fw fa-graduation-cap" # Or ai ai-google-scholar if you add academicons
      url: "https://scholar.google.com/citations?user=Gbr4BMEAAAAJ&hl=en"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes # Use the theme gem
theme: minimal-mistakes-jekyll

# Outputting Structure
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/London # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# include:
#   - _pages
# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE.md

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  # - jekyll-seo-tag # Can cause conflicts with manual title/desc sometimes
  - jekyll-include-cache

# Footer Links
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kieran514"
    # Add other footer links if desired

# Defaults for collections
# defaults:
#   # _posts
#   - scope:
#       path: ""
#       type: posts
#     values:
#       layout: single
#       author_profile: true
#       read_time: true
#       comments: false # Disable comments
#       share: false # Disable social share
#       related: true
#   # _pages
#   - scope:
#       path: "_pages"
#       type: pages
#     values:
#       layout: single
#       author_profile: true

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
