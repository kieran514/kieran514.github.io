# Site settings
title: Kieran Saunders | Computer Vision Research
email: 190229315@aston.ac.uk
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Kieran Saunders, PhD student at Aston University,
  researching self-supervised monocular depth estimation, 3D reconstruction,
  and robust computer vision.
baseurl: "" # the subpath of your site, e.g. /blog. If hosted at root, leave empty.
url: "" # the base hostname & protocol for your site, e.g. http://example.com. Leave empty for GitHub Pages default or fill in if using custom domain.

# Author Profile (used in templates)
author:
  name: "Kieran Saunders"
  avatar: "/assets/images/profile.jpg" # Make sure this image exists
  bio: "PhD Student @ Aston University | Computer Vision | Depth Estimation | 3D Reconstruction"
  location: "Birmingham, UK"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:190229315@aston.ac.uk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://kieran514.github.io/" # Confirm this link
    # Add Google Scholar, LinkedIn etc. here if desired
    # - label: "LinkedIn"
    #   icon: "fab fa-fw fa-linkedin"
    #   url: "YOUR_LINKEDIN_LINK"

# Build settings
markdown: kramdown
theme: minima # Can be removed if providing all styling yourself, but useful base
# plugins:
#   - jekyll-feed
#   - jekyll-seo-tag

# Theme-specific settings (if using a theme like minima, otherwise define your own)
minima:
  skin: dark # Or default. Or remove if fully custom CSS.
  social_links: # Duplicates author links slightly, but some themes use this
    github: kieran514
    # linkedin: your_linkedin
    # google_scholar: your_scholar_id

# Sass settings (if using style.scss)
sass:
  sass_dir: assets/css
  style: compressed # :expanded for debugging

# Defaults for pages
defaults:
  - scope:
      path: "" # an empty string here means all files in the project
      type: "pages" # applies to pages
    values:
      layout: "page" # Default layout for all pages
      author_profile: true # Show author profile on pages by default

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/