# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Kieran Saunders | Computer Vision & Software Engineering"
email: "190229315@aston.ac.uk"
description: >- # this means to ignore newlines until "baseurl:"
  PhD candidate at Aston University specializing in self-supervised monocular depth estimation,
  robustness in computer vision, and 3D reconstruction.
baseurl: "" # the subpath of your site, e.g. /blog. Leave empty for username.github.io
url: "https://kieran514.github.io" # the base hostname & protocol for your site
github_username: kieran514

# Minimal Mistakes Theme Settings
minimal_mistakes_skin: "air" 

# Author Settings (Appears in sidebar)
author:
  name: "Kieran Saunders"
  avatar: "/assets/images/kieran_avatar.jpg"
  bio: "PhD Candidate, Aston University<br>Computer Vision & Machine Learning"
  location: "Birmingham, UK"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:190229315@aston.ac.uk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kieran514"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/kieran-saunders-6a5a801a3/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Gbr4BMEAAAAJ&hl=en"

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes"

# Outputting Structure
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: "Europe/London"

# NOTE: The 'plugins' list is intentionally removed. 
# The 'github-pages' gem in your Gemfile handles this automatically for GitHub Pages.

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE.md
  - package.json
  - package-lock.json

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
