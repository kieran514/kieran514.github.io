<!-- Load tsParticles library -->
<script src="{{ '/assets/js/particles.min.js' | relative_url }}"></script>

<!-- Load custom particle config AFTER the library and DOM is ready -->
<!-- Using defer ensures it runs after HTML is parsed -->
<script defer src="{{ '/assets/js/custom-particles.js' | relative_url }}"></script>

<!-- Add container for particles - place this in your layout where needed, -->
<!-- but it's often better handled by the script itself if it targets an ID -->
<!-- We will create the div structure in the layout or here if needed -->
<!-- The custom-particles.js script targets "particles-js" -->
<!-- Ensure a div with id="particles-js" exists in your main layout -->

<!-- Add the div for particles-js here, will be loaded in the head -->
<!-- It's generally better to place this div in the body of your default layout (_layouts/default.html) -->
<!-- but putting it here ensures it exists. Styling will position it. -->
<!-- <div id="particles-js"></div> -->
<!-- Note: Placing the div here might not be ideal. Check _layouts/default.html -->
<!-- Instead, let's ensure the JS runs by adding it here, and assume -->
<!-- the <div id="particles-js"></div> is added manually to the default layout file -->

<style>
/* Ensure the particle canvas has correct size and position */
#particles-js {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: -1; /* Behind other content */
}
</style>
